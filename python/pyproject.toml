[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-browser-companion"
dynamic = ["version"]
description = "Python client and Home Assistant config-flow helper for the Browser Companion add-on."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Przemko92" }]
keywords = ["homeassistant", "home-assistant", "browser-companion", "aiohttp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/Przemko92/homeassistant-browser-companion"
Documentation = "https://github.com/Przemko92/homeassistant-browser-companion/blob/master/python/README.md"
Issues = "https://github.com/Przemko92/homeassistant-browser-companion/issues"
Changelog = "https://github.com/Przemko92/homeassistant-browser-companion/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "voluptuous>=0.13",
]

[tool.hatch.version]
path = "ha_browser_companion/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ha_browser_companion"]

[tool.hatch.build.targets.sdist]
include = [
    "/ha_browser_companion",
    "/LICENSE",
    "/README.md",
    "/examples",
    "/tests",
]
